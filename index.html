<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AkvaSvet - Akvarijske ribice, kozice in oprema</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        aqua: { 50: '#f0fdfa', 100: '#ccfbf1', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e', 900: '#134e4a' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen font-sans">
    <div class="bg-teal-700 text-white text-xs md:text-sm py-2 px-4 text-center font-medium">
        🌿 Domača vzreja akvarijskih ribic in kozic! Osebni prevzem ali dogovor.
    </div>
    <header class="bg-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between h-20 items-center">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="filterCategory('vse')">
                <div class="bg-teal-600 text-white p-3 rounded-2xl shadow-lg"><i class="fa-solid fa-fish-fins text-2xl"></i></div>
                <div>
                    <span class="text-2xl font-bold text-teal-700">AkvaSvet</span>
                    <span class="block text-xs text-slate-400 font-medium">HOBI AKVARISTIKA</span>
                </div>
            </div>
            <button onclick="toggleCartModal()" class="relative bg-teal-600 hover:bg-teal-700 text-white px-4 py-2.5 rounded-xl font-semibold flex items-center space-x-2">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>Košarica</span>
                <span id="cart-count-badge" class="bg-amber-400 text-slate-900 text-xs font-bold px-2 py-0.5 rounded-full ml-1">0</span>
            </button>
        </div>
    </header>
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow w-full">
        <div class="flex flex-wrap items-center justify-center gap-2 mb-8" id="category-filters"></div>
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>
    <footer class="bg-slate-900 text-slate-400 py-6 text-center text-xs">
        © 2026 AkvaSvet - Vse pravice pridržane.
    </footer>

    <!-- MODAL: KOŠARICA -->
    <div id="cart-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex justify-end">
        <div class="bg-white w-full max-w-lg h-full shadow-2xl flex flex-col justify-between overflow-hidden">
            <div class="p-5 bg-slate-900 text-white flex justify-between items-center">
                <h3 class="font-bold text-lg">Vaša košarica</h3>
                <button onclick="toggleCartModal()" class="text-xl">&times;</button>
            </div>
            <div class="p-5 flex-grow overflow-y-auto space-y-4" id="cart-items-container"></div>
            <div class="p-5 bg-slate-50 border-t space-y-4">
                <div class="flex justify-between items-center text-lg font-bold">
                    <span>Skupaj:</span>
                    <span id="cart-total-price" class="text-teal-700">0.00 €</span>
                </div>
                <form onsubmit="submitOrder(event)" class="space-y-3">
                    <input type="text" id="cust-name" required placeholder="Ime in Priimek" class="w-full p-2.5 border rounded-lg text-xs">
                    <input type="tel" id="cust-phone" required placeholder="Telefon" class="w-full p-2.5 border rounded-lg text-xs">
                    <button type="submit" class="w-full bg-teal-700 text-white py-3 rounded-xl font-bold text-xs">Pošlji povpraševanje</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://wagfezozagdbktyzljcz.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_hZhjiJvCWpgsdBUpUXQzlA_V1R_OO1S";
        const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        let products = [];
        let cart = [];
        let activeCategory = 'vse';

        window.onload = function() {
            renderCategories();
            fetchProductsFromSupabase();
        };

        async function fetchProductsFromSupabase() {
            const container = document.getElementById('product-grid');
            container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">Nalaganje iz baze...</div>`;
            try {
                const { data, error } = await supabaseClient.from('products').select('*');
                if (error) throw error;
                products = data || [];
                renderProducts();
            } catch (err) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-rose-500">Napaka pri povezavi z bazo.</div>`;
            }
        }

        function renderCategories() {
            const cats = [
                { id: 'vse', name: 'Vsi izdelki', icon: 'fa-border-all' },
                { id: 'ribice', name: 'Akvarijske ribice', icon: 'fa-fish' },
                { id: 'kozice', name: 'Kozice', icon: 'fa-bug' },
                { id: 'rastline', name: 'Rastline', icon: 'fa-leaf' },
                { id: 'oprema', name: 'Hrana & Oprema', icon: 'fa-box' }
            ];
            document.getElementById('category-filters').innerHTML = cats.map(c => `
                <button onclick="activeCategory='${c.id}'; renderCategories(); renderProducts();" class="px-4 py-2 rounded-xl text-sm font-semibold border ${activeCategory === c.id ? 'bg-teal-700 text-white border-teal-700' : 'bg-white text-slate-600 border-slate-200'}">
                    <i class="fa-solid ${c.icon} mr-1"></i> ${c.name}
                </button>
            `).join('');
        }

        function renderProducts() {
            const container = document.getElementById('product-grid');
            const filtered = activeCategory === 'vse' ? products : products.filter(p => p.category === activeCategory);
            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">Trenutno ni izdelkov v tej kategoriji.</div>`;
                return;
            }
            container.innerHTML = filtered.map(p => `
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col justify-between">
                    <div>
                        <div class="h-48 bg-slate-100 overflow-hidden relative">
                            <img src="${p.image || 'https://placehold.co/400x300/134e4a/ffffff?text=AkvaSvet'}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/400x300/134e4a/ffffff?text=AkvaSvet'">
                        </div>
                        <div class="p-4">
                            <span class="text-[10px] font-bold text-teal-600 uppercase">${p.category || ''}</span>
                            <h3 class="font-bold text-base text-slate-800 mt-0.5 mb-1">${p.name}</h3>
                            <p class="text-slate-500 text-xs line-clamp-2">${p.desc || p.description || ''}</p>
                        </div>
                    </div>
                    <div class="p-4 pt-0 flex items-center justify-between border-t border-slate-100 mt-2">
                        <span class="text-lg font-extrabold text-slate-900">${parseFloat(p.price || 0).toFixed(2)} €</span>
                        <button onclick="addToCart(${p.id})" class="bg-teal-600 text-white px-3.5 py-2 rounded-xl text-xs font-bold">Dodaj</button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const p = products.find(x => x.id === id);
            if (!p) return;
            const item = cart.find(x => x.id === id);
            if (item) item.qty++; else cart.push({ ...p, qty: 1 });
            document.getElementById('cart-count-badge').innerText = cart.reduce((a,b)=>a+b.qty,0);
            renderCartModal();
        }

        function toggleCartModal() {
            document.getElementById('cart-modal').classList.toggle('hidden');
            renderCartModal();
        }

        function renderCartModal() {
            const container = document.getElementById('cart-items-container');
            if (cart.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-400 py-10">Košarica je prazna.</p>`;
                document.getElementById('cart-total-price').innerText = "0.00 €";
                return;
            }
            let total = 0;
            container.innerHTML = cart.map(i => {
                total += i.price * i.qty;
                return `<div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border"><span>${i.name} (${i.qty}x)</span><b>${(i.price*i.qty).toFixed(2)} €</b></div>`;
            }).join('');
            document.getElementById('cart-total-price').innerText = total.toFixed(2) + " €";
        }

        function submitOrder(e) {
            e.preventDefault();
            alert("Naročilo pripravljeno!");
            cart = [];
            document.getElementById('cart-count-badge').innerText = "0";
            toggleCartModal();
        }
    </script>
</body>
</html>
