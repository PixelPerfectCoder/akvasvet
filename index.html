<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AkvarijskiSvet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen pb-24 md:pb-0">
    <header class="bg-white shadow-sm sticky top-0 z-40 border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-4 flex justify-between h-20 items-center">
            <h1 class="text-2xl font-black text-teal-800 cursor-pointer" onclick="filterCategory('vse')">AkvarijskiSvet</h1>
            <button onclick="toggleCartModal()" class="bg-teal-600 text-white px-5 py-2.5 rounded-xl font-semibold flex items-center space-x-2">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>Košarica</span>
                <span id="cart-count-badge-desktop" class="bg-amber-400 text-slate-900 text-xs font-black px-2 py-0.5 rounded-full">0</span>
            </button>
        </div>
    </header>

    <div id="toast-container" class="fixed top-24 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="flex flex-wrap items-center justify-center gap-2 mb-8" id="category-filters"></div>
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>

    <!-- CART MODAL -->
    <div id="cart-modal" class="fixed inset-0 bg-slate-900/70 z-50 hidden flex justify-end">
        <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col justify-between">
            <div class="p-5 bg-slate-900 text-white flex justify-between items-center">
                <h3 class="font-bold">Vaša Košarica</h3>
                <button onclick="toggleCartModal()"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-5 flex-grow overflow-y-auto space-y-3" id="cart-items-container"></div>
            <div class="p-5 bg-slate-50 border-t space-y-3">
                <div class="flex justify-between font-bold">
                    <span>Skupaj:</span>
                    <span id="cart-total-price" class="text-teal-800 text-lg">0.00 €</span>
                </div>
                <form id="order-form" onsubmit="submitOrder(event)" class="space-y-2">
                    <input type="text" id="cust-name" required placeholder="Ime in Priimek" class="w-full p-2 border rounded text-xs">
                    <input type="email" id="cust-email" required placeholder="E-pošta" class="w-full p-2 border rounded text-xs">
                    <input type="tel" id="cust-phone" required placeholder="Telefon" class="w-full p-2 border rounded text-xs">
                    <button type="submit" id="submit-btn" class="w-full bg-teal-700 text-white py-2.5 rounded font-bold text-xs">Oddaj naročilo</button>
                </form>
            </div>
        </div>
    </div>

    <!-- PRODUCT MODAL -->
    <div id="product-modal" class="fixed inset-0 bg-slate-900/70 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl overflow-hidden p-6 relative">
            <button onclick="closeProductModal()" class="absolute top-4 right-4"><i class="fa-solid fa-xmark text-xl"></i></button>
            <img id="modal-img" src="" class="w-full h-48 object-cover rounded-xl mb-4">
            <h2 id="modal-title" class="text-xl font-bold"></h2>
            <p id="modal-desc" class="text-sm text-slate-600 my-2"></p>
            <div class="flex justify-between items-center mt-4">
                <span id="modal-price" class="text-lg font-black text-teal-800"></span>
                <button id="modal-add-btn" class="bg-teal-600 text-white px-4 py-2 rounded-xl text-xs font-bold">Dodaj v košarico</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://wagfezozagdbktyzljcz.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_hZhjiJvCWpgsdBUpUXQzlA_V1R_OO1S";
        const WEB3FORMS_KEY = "59254fb0-9372-4565-a64b-a51ed72ed00e";
        const FALLBACK_IMAGE = "https://images.unsplash.com/photo-1522069169874-c58ec4b76be5?w=600&auto=format&fit=crop&q=80";

        let supabaseClient = null;
        try {
            if (window.supabase) supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) {}

        let products = [];
        let cart = JSON.parse(localStorage.getItem('akvasvet_cart')) || [];
        let activeCategory = 'vse';
        let currentModalProductId = null;

        const FIXED_CATEGORIES = [
            { id: 'vse', label: 'Vsi izdelki' },
            { id: 'ribice', label: 'Ribice' },
            { id: 'kozice', label: 'Kozice' },
            { id: 'rastline', label: 'Rastline' },
            { id: 'hrana', label: 'Hrana' },
            { id: 'oprema', label: 'Oprema' }
        ];

        window.onload = function() {
            updateCartBadge();
            renderCategories();
            fetchProducts();
        };

        function formatPrice(val) { return (parseFloat(val) || 0).toFixed(2) + ' €'; }

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const t = document.createElement('div');
            t.className = `px-4 py-2 rounded shadow text-white text-xs font-bold ${type === 'error' ? 'bg-rose-600' : 'bg-teal-800'}`;
            t.textContent = msg;
            container.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        async function fetchProducts() {
            try {
                if (!supabaseClient) throw new Error();
                const { data, error } = await supabaseClient.from('products').select('*');
                if (error || !data) throw error;
                products = data.map(p => ({
                    id: p.id,
                    name: p.name || p.naziv || 'Izdelek',
                    category: (p.category || p.kategorija || 'ostalo').toLowerCase().trim(),
                    price: parseFloat(p.price || p.cena || 0),
                    quantity: parseInt(p.quantity ?? p.zaloga ?? 0),
                    views: parseInt(p.views || 0),
                    desc: p.desc || p.opis || '',
                    image: p.image || p.image_url || FALLBACK_IMAGE
                }));
            } catch (e) {
                products = [
                    { id: 101, name: "Gupiji", category: "ribice", price: 1.50, quantity: 10, views: 0, desc: "Test", image: FALLBACK_IMAGE }
                ];
            }
            renderProducts();
        }

        async function incrementViews(id) {
            const p = products.find(x => x.id == id);
            if (!p) return;
            p.views = (p.views || 0) + 1;
            if (supabaseClient) {
                await supabaseClient.from('products').update({ views: p.views }).eq('id', id);
            }
        }

        function renderCategories() {
            const c = document.getElementById('category-filters');
            if (!c) return;
            c.innerHTML = FIXED_CATEGORIES.map(cat => `
                <button onclick="filterCategory('${cat.id}')" class="px-4 py-2 rounded-xl text-xs font-bold border ${activeCategory === cat.id ? 'bg-teal-700 text-white border-teal-700' : 'bg-white text-slate-600'}">
                    ${cat.label}
                </button>
            `).join('');
        }

        function filterCategory(id) {
            activeCategory = id;
            renderCategories();
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            if (!grid) return;

            let filtered = activeCategory === 'vse' ? products : products.filter(p => p.category === activeCategory);

            // Top 2 priljubljeno logika
            const popularIds = new Set();
            ['ribice', 'kozice', 'rastline', 'hrana', 'oprema'].forEach(cat => {
                products.filter(p => p.category === cat && p.quantity > 0 && p.views > 0)
                    .sort((a, b) => b.views - a.views)
                    .slice(0, 2)
                    .forEach(p => popularIds.add(p.id));
            });

            grid.innerHTML = filtered.map(p => {
                const inStock = p.quantity > 0;
                const isPopular = popularIds.has(p.id);
                return `
                    <div class="bg-white rounded-2xl border p-4 flex flex-col justify-between shadow-sm">
                        <div class="h-40 bg-slate-100 rounded-xl overflow-hidden relative cursor-pointer" onclick="openProductModal(${p.id})">
                            <img src="${p.image}" class="w-full h-full object-cover" onerror="this.src='${FALLBACK_IMAGE}'">
                            <div class="absolute top-2 left-2 flex flex-col gap-1">
                                <span class="bg-emerald-600 text-white text-[9px] px-2 py-0.5 rounded-full">${inStock ? 'Zaloga: ' + p.quantity : 'Ni na zalogi'}</span>
                                ${isPopular ? '<span class="bg-amber-500 text-white text-[9px] px-2 py-0.5 rounded-full font-bold">🔥 Priljubljeno</span>' : ''}
                            </div>
                        </div>
                        <div class="mt-3">
                            <span class="text-[10px] text-teal-600 font-bold uppercase">${p.category}</span>
                            <h3 class="font-bold text-sm cursor-pointer" onclick="openProductModal(${p.id})">${p.name}</h3>
                        </div>
                        <div class="flex justify-between items-center mt-3 pt-2 border-t">
                            <span class="font-black">${formatPrice(p.price)}</span>
                            <button onclick="addToCart(${p.id})" ${!inStock ? 'disabled' : ''} class="bg-teal-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold ${!inStock ? 'opacity-50 cursor-not-allowed' : ''}">Dodaj</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function openProductModal(id) {
            const p = products.find(x => x.id == id);
            if (!p) return;
            currentModalProductId = p.id;
            document.getElementById('modal-img').src = p.image;
            document.getElementById('modal-title').textContent = p.name;
            document.getElementById('modal-desc').textContent = p.desc;
            document.getElementById('modal-price').textContent = formatPrice(p.price);
            
            const btn = document.getElementById('modal-add-btn');
            if (p.quantity > 0) {
                btn.disabled = false;
                btn.className = "bg-teal-600 text-white px-4 py-2 rounded-xl text-xs font-bold";
                btn.onclick = () => { addToCart(p.id); closeProductModal(); };
            } else {
                btn.disabled = true;
                btn.className = "bg-slate-300 text-slate-500 px-4 py-2 rounded-xl text-xs font-bold cursor-not-allowed";
            }

            document.getElementById('product-modal').classList.remove('hidden');
            await incrementViews(p.id);
            renderProducts();
        }

        function closeProductModal() { document.getElementById('product-modal').classList.add('hidden'); }

        function addToCart(id) {
            const p = products.find(x => x.id == id);
            if (!p || p.quantity <= 0) return;
            const item = cart.find(x => x.id == id);
            if (item) {
                if (item.qty + 1 > p.quantity) { showToast("Zaloga je omejena!", "error"); return; }
                item.qty++;
            } else {
                cart.push({ id: p.id, name: p.name, price: p.price, image: p.image, qty: 1 });
            }
            saveCart();
            showToast(`Dodano: ${p.name}`);
        }

        function changeCartQty(id, delta) {
            const p = products.find(x => x.id == id);
            const item = cart.find(x => x.id == id);
            if (!item || !p) return;
            item.qty += delta;
            if (item.qty > p.quantity) { item.qty = p.quantity; showToast("Maksimalna zaloga dosežena", "error"); }
            if (item.qty <= 0) cart = cart.filter(x => x.id != id);
            saveCart();
        }

        function removeFromCart(id) { cart = cart.filter(x => x.id != id); saveCart(); }

        function saveCart() {
            localStorage.setItem('akvasvet_cart', JSON.stringify(cart));
            updateCartBadge();
            renderCartItems();
        }

        function updateCartBadge() {
            const count = cart.reduce((sum, i) => sum + i.qty, 0);
            const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            document.getElementById('cart-count-badge-desktop').textContent = count;
            document.getElementById('cart-total-price').textContent = formatPrice(total);
        }

        function toggleCartModal() {
            document.getElementById('cart-modal').classList.toggle('hidden');
            renderCartItems();
        }

        function renderCartItems() {
            const c = document.getElementById('cart-items-container');
            if (!c) return;
            if (cart.length === 0) {
                c.innerHTML = `<p class="text-center text-slate-400 text-xs py-8">Košarica je prazna.</p>`;
                return;
            }
            c.innerHTML = cart.map(i => `
                <div class="flex items-center justify-between bg-slate-50 p-2 rounded-xl border">
                    <div class="flex items-center space-x-2">
                        <img src="${i.image}" class="w-10 h-10 object-cover rounded-lg" onerror="this.src='${FALLBACK_IMAGE}'">
                        <div>
                            <h4 class="font-bold text-xs">${i.name}</h4>
                            <span class="text-[10px] text-teal-700">${formatPrice(i.price)}</span>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="changeCartQty(${i.id}, -1)" class="px-2 bg-slate-200 rounded">-</button>
                        <span class="text-xs font-bold">${i.qty}</span>
                        <button onclick="changeCartQty(${i.id}, 1)" class="px-2 bg-slate-200 rounded">+</button>
                        <button onclick="removeFromCart(${i.id})" class="text-rose-500 ml-2"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        async function submitOrder(e) {
            e.preventDefault();
            if (cart.length === 0) { showToast("Košarica je prazna!", "error"); return; }
            
            const name = document.getElementById('cust-name').value;
            const email = document.getElementById('cust-email').value;
            const phone = document.getElementById('cust-phone').value;
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.textContent = "Pošiljanje...";

            try {
                for (const item of cart) {
                    const p = products.find(x => x.id == item.id);
                    if (p && supabaseClient) {
                        const newStock = Math.max(0, p.quantity - item.qty);
                        await supabaseClient.from('products').update({ quantity: newStock }).eq('id', item.id);
                    }
                }

                const fd = new FormData();
                fd.append("access_key", WEB3FORMS_KEY);
                fd.append("subject", `Novo naročilo: ${name}`);
                fd.append("Ime", name);
                fd.append("E-pošta", email);
                fd.append("Telefon", phone);
                fd.append("Izdelki", cart.map(i => `${i.name} (${i.qty}x)`).join(', '));

                const res = await fetch("https://api.web3forms.com/submit", { method: "POST", body: fd });
                const json = await res.json();

                if (json.success) {
                    showToast("Naročilo uspešno oddano!");
                    cart = [];
                    saveCart();
                    toggleCartModal();
                    document.getElementById('order-form').reset();
                    fetchProducts();
                } else {
                    throw new Error();
                }
            } catch (err) {
                showToast("Napaka pri oddaji naročila.", "error");
            } finally {
                btn.disabled = false;
                btn.textContent = "Oddaj naročilo";
            }
        }
    </script>
</body>
</html>
