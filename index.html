<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AkvarijskiSvet - Akvarijske ribice, kozice in oprema</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        aqua: { 50: '#f0fdfa', 100: '#ccfbf1', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e', 900: '#134e4a' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen font-sans pb-20 md:pb-0">
    <div class="bg-teal-700 text-white text-xs md:text-sm py-2 px-4 text-center font-medium">
        🌿 Domača vzreja akvarijskih ribic in kozic! Osebni prevzem ali dogovor.
    </div>
    
    <header class="bg-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between h-20 items-center">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="filterCategory('vse')">
                <div class="bg-teal-600 text-white p-3 rounded-2xl shadow-lg"><i class="fa-solid fa-fish-fins text-2xl"></i></div>
                <div>
                    <span class="text-xl sm:text-2xl font-bold text-teal-700 leading-tight">AkvarijskiSvet</span>
                    <span class="block text-[10px] sm:text-xs text-slate-400 font-medium">HOBI AKVARISTIKA</span>
                </div>
            </div>
            <!-- Gumb za košarico na RAČUNALNIKU (skrit na telefonih) -->
            <button onclick="toggleCartModal()" class="hidden md:flex relative bg-teal-600 hover:bg-teal-700 text-white px-4 py-2.5 rounded-xl font-semibold items-center space-x-2 shadow">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>Košarica</span>
                <span id="cart-count-badge-desktop" class="bg-amber-400 text-slate-900 text-xs font-bold px-2 py-0.5 rounded-full ml-1">0</span>
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow w-full">
        <div class="flex flex-wrap items-center justify-center gap-2 mb-8" id="category-filters"></div>
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>

    <footer class="bg-slate-900 text-slate-400 py-6 text-center text-xs border-t border-slate-800">
        © 2026 AkvarijskiSvet - Vse pravice pridržane.
    </footer>

    <!-- PLAVAJOČA SPODNJA VRSTICA ZA KOŠARICO NA TELEFONU (prikazana samo na manjših zaslonih) -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-2xl p-3 z-40 md:hidden flex justify-between items-center px-5">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-cart-shopping text-teal-700 text-xl"></i>
            <span class="font-bold text-sm text-slate-800">Skupaj: <span id="mobile-cart-total" class="text-teal-700">0.00 €</span></span>
        </div>
        <button onclick="toggleCartModal()" class="bg-teal-600 hover:bg-teal-700 text-white px-5 py-2.5 rounded-xl font-bold text-xs flex items-center space-x-2 shadow-md">
            <span>Odpri košarico</span>
            <span id="cart-count-badge-mobile" class="bg-amber-400 text-slate-900 text-[10px] font-extrabold px-2 py-0.5 rounded-full">0</span>
        </button>
    </div>

    <!-- MODAL: PODROBNOSTI IZDELKA -->
    <div id="product-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-xl rounded-2xl shadow-2xl overflow-hidden flex flex-col relative">
            <button onclick="closeProductModal()" class="absolute top-4 right-4 bg-slate-900/50 hover:bg-slate-900 text-white w-8 h-8 rounded-full flex items-center justify-center z-10 transition">&times;</button>
            <div class="h-64 bg-slate-100 overflow-hidden relative">
                <img id="modal-img" src="" class="w-full h-full object-cover">
            </div>
            <div class="p-6 space-y-4">
                <span id="modal-category" class="text-xs font-bold text-teal-600 uppercase tracking-wider"></span>
                <h2 id="modal-title" class="text-xl font-bold text-slate-900"></h2>
                <p id="modal-desc" class="text-slate-600 text-sm leading-relaxed"></p>
                <div class="flex items-center justify-between pt-4 border-t border-slate-100">
                    <span id="modal-price" class="text-2xl font-extrabold text-teal-700"></span>
                    <div class="flex items-center space-x-3">
                        <div class="flex items-center border border-slate-300 rounded-xl overflow-hidden bg-slate-50">
                            <button onclick="changeModalQty(-1)" class="px-3 py-2 text-slate-600 hover:bg-slate-200 font-bold">-</button>
                            <span id="modal-qty" class="px-3 py-2 text-sm font-bold text-slate-800">1</span>
                            <button onclick="changeModalQty(1)" class="px-3 py-2 text-slate-600 hover:bg-slate-200 font-bold">+</button>
                        </div>
                        <button id="modal-add-btn" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2.5 rounded-xl text-sm font-bold transition shadow">Dodaj</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: KOŠARICA IN NAROČILO -->
    <div id="cart-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex justify-end">
        <div class="bg-white w-full max-w-lg h-full shadow-2xl flex flex-col justify-between overflow-hidden">
            <div class="p-5 bg-slate-900 text-white flex justify-between items-center border-b border-slate-800">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-envelope text-teal-400 text-lg"></i>
                    <h3 class="font-bold text-lg">Naročilo preko E-pošte</h3>
                </div>
                <button onclick="toggleCartModal()" class="text-xl hover:text-teal-400">&times;</button>
            </div>
            <div class="p-5 flex-grow overflow-y-auto space-y-4" id="cart-items-container"></div>
            <div class="p-5 bg-slate-50 border-t space-y-4">
                <div class="flex justify-between items-center text-lg font-bold">
                    <span>Skupaj za plačilo:</span>
                    <span id="cart-total-price" class="text-teal-700 text-xl font-extrabold">0.00 €</span>
                </div>
                <form onsubmit="submitOrder(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Ime in Priimek *</label>
                        <input type="text" id="cust-name" required placeholder="npr. Janez Novak" class="w-full p-2.5 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-teal-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Telefonska številka *</label>
                        <input type="tel" id="cust-phone" required placeholder="npr. 040 123 456" class="w-full p-2.5 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-teal-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Opombe / Željen čas prevzema</label>
                        <textarea id="cust-notes" rows="2" placeholder="Napišite morebitna vprašanja ali želje..." class="w-full p-2.5 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-teal-500 focus:outline-none"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-teal-700 hover:bg-teal-800 text-white py-3 rounded-xl font-bold text-xs shadow-md transition flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-paper-plane"></i>
                        <span>Pošlji naročilo preko E-pošte</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://wagfezozagdbktyzljcz.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_hZhjiJvCWpgsdBUpUXQzlA_V1R_OO1S";
        const MOJ_EMAIL = "info@akvarijskisvet.si";

        const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        let products = [];
        let cart = JSON.parse(localStorage.getItem('akvasvet_cart')) || [];
        let activeCategory = 'vse';
        let currentModalProductId = null;
        let currentModalQty = 1;

        window.onload = function() {
            updateCartBadge();
            renderCategories();
            fetchProductsFromSupabase();
        };

        async function fetchProductsFromSupabase() {
            const container = document.getElementById('product-grid');
            container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">Nalaganje iz baze...</div>`;
            try {
                const { data, error } = await supabaseClient.from('products').select('*');
                if (error) throw error;
                products = data || [];
                renderProducts();
            } catch (err) {
                console.error(err);
                container.innerHTML = `<div class="col-span-full text-center py-12 text-rose-500">Napaka pri povezavi z bazo.</div>`;
            }
        }

        function renderCategories() {
            const cats = [
                { id: 'vse', name: 'Vsi izdelki', icon: 'fa-border-all' },
                { id: 'ribice', name: 'Akvarijske ribice', icon: 'fa-fish' },
                { id: 'kozice', name: 'Kozice', icon: 'fa-bug' },
                { id: 'rastline', name: 'Rastline', icon: 'fa-leaf' },
                { id: 'hrana', name: 'Hrana', icon: 'fa-bowl-food' },
                { id: 'oprema', name: 'Oprema', icon: 'fa-box' }
            ];
            document.getElementById('category-filters').innerHTML = cats.map(c => `
                <button onclick="filterCategory('${c.id}')" class="px-4 py-2 rounded-xl text-sm font-semibold border ${activeCategory === c.id ? 'bg-teal-700 text-white border-teal-700 shadow-md' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-100'}">
                    <i class="fa-solid ${c.icon} mr-1"></i> ${c.name}
                </button>
            `).join('');
        }

        function filterCategory(catId) {
            activeCategory = catId;
            renderCategories();
            renderProducts();
        }

        function renderProducts() {
            const container = document.getElementById('product-grid');
            const categoryOrder = { 'ribice': 1, 'kozice': 2, 'rastline': 3, 'hrana': 4, 'oprema': 5 };

            let filtered = [];
            if (activeCategory === 'vse') {
                filtered = [...products].sort((a, b) => {
                    const orderA = categoryOrder[a.category] || 99;
                    const orderB = categoryOrder[b.category] || 99;
                    return orderA - orderB;
                });
            } else {
                filtered = products.filter(p => p.category === activeCategory);
            }

            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">Trenutno ni izdelkov v tej kategoriji.</div>`;
                return;
            }

            container.innerHTML = filtered.map(p => `
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition overflow-hidden flex flex-col justify-between">
                    <div>
                        <div class="h-48 bg-slate-100 overflow-hidden relative cursor-pointer" onclick="openProductModal(${p.id})">
                            <img src="${p.image || 'https://placehold.co/400x300/134e4a/ffffff?text=AkvarijskiSvet'}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/400x300/134e4a/ffffff?text=AkvarijskiSvet'">
                        </div>
                        <div class="p-4">
                            <span class="text-[10px] font-bold text-teal-600 uppercase tracking-wider">${p.category || 'splošno'}</span>
                            <h3 class="font-bold text-base text-slate-800 mt-0.5 mb-1 cursor-pointer hover:text-teal-700" onclick="openProductModal(${p.id})">${p.name}</h3>
                            <p class="text-slate-500 text-xs line-clamp-2 leading-relaxed">${p.desc || p.description || 'Kakovostna ponudba domače vzreje.'}</p>
                        </div>
                    </div>
                    <div class="p-4 pt-0 flex items-center justify-between border-t border-slate-100 mt-2">
                        <span class="text-lg font-extrabold text-slate-900">${parseFloat(p.price || 0).toFixed(2)} €</span>
                        <button onclick="addToCartDirect(${p.id})" class="bg-teal-600 hover:bg-teal-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold transition shadow">Dodaj</button>
                    </div>
                </div>
            `).join('');
        }

        function openProductModal(id) {
            const p = products.find(x => x.id === id);
            if (!p) return;
            currentModalProductId = id;
            currentModalQty = 1;
            document.getElementById('modal-qty').innerText = currentModalQty;
            document.getElementById('modal-img').src = p.image || 'https://placehold.co/400x300/134e4a/ffffff?text=AkvarijskiSvet';
            document.getElementById('modal-category').innerText = p.category || 'splošno';
            document.getElementById('modal-title').innerText = p.name;
            document.getElementById('modal-desc').innerText = p.desc || p.description || 'Ni dodatnega opisa.';
            document.getElementById('modal-price').innerText = parseFloat(p.price || 0).toFixed(2) + ' €';
            
            document.getElementById('modal-add-btn').onclick = function() {
                addModalToCart();
            };
            document.getElementById('product-modal').classList.remove('hidden');
        }

        function closeProductModal() {
            document.getElementById('product-modal').classList.add('hidden');
        }

        function changeModalQty(change) {
            currentModalQty += change;
            if (currentModalQty < 1) currentModalQty = 1;
            document.getElementById('modal-qty').innerText = currentModalQty;
        }

        function addModalToCart() {
            const p = products.find(x => x.id === currentModalProductId);
            if (!p) return;
            const item = cart.find(x => x.id === currentModalProductId);
            if (item) {
                item.qty += currentModalQty;
            } else {
                cart.push({ ...p, qty: currentModalQty });
            }
            saveCart();
            closeProductModal();
            toggleCartModal();
        }

        function addToCartDirect(id) {
            const p = products.find(x => x.id === id);
            if (!p) return;
            const item = cart.find(x => x.id === id);
            if (item) {
                item.qty++;
            } else {
                cart.push({ ...p, qty: 1 });
            }
            saveCart();
            toggleCartModal();
        }

        function updateCartQty(id, change) {
            const item = cart.find(x => x.id === id);
            if (!item) return;
            item.qty += change;
            if (item.qty <= 0) {
                removeFromCart(id);
            } else {
                saveCart();
                renderCartModal();
            }
        }

        function removeFromCart(id) {
            cart = cart.filter(x => x.id !== id);
            saveCart();
            renderCartModal();
        }

        function saveCart() {
            localStorage.setItem('akvasvet_cart', JSON.stringify(cart));
            updateCartBadge();
        }

        function updateCartBadge() {
            const totalQty = cart.reduce((a, b) => a + b.qty, 0);
            const totalPrice = cart.reduce((a, b) => a + ((b.price || 0) * b.qty), 0);

            // Posodobi znački na računalniku in telefonu
            const badgeDesktop = document.getElementById('cart-count-badge-desktop');
            if (badgeDesktop) badgeDesktop.innerText = totalQty;
            
            const badgeMobile = document.getElementById('cart-count-badge-mobile');
            if (badgeMobile) badgeMobile.innerText = totalQty;

            const mobileTotal = document.getElementById('mobile-cart-total');
            if (mobileTotal) mobileTotal.innerText = totalPrice.toFixed(2) + " €";
        }

        function toggleCartModal() {
            document.getElementById('cart-modal').classList.toggle('hidden');
            renderCartModal();
        }

        function renderCartModal() {
            const container = document.getElementById('cart-items-container');
            updateCartBadge();
            
            if (cart.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-400 py-10">Košarica je prazna.</p>`;
                document.getElementById('cart-total-price').innerText = "0.00 €";
                return;
            }
            let total = 0;
            container.innerHTML = cart.map(i => {
                const sub = (i.price || 0) * i.qty;
                total += sub;
                return `
                    <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-200">
                        <div class="pr-2">
                            <span class="font-semibold text-xs text-slate-800 block">${i.name}</span>
                            <span class="text-[11px] text-slate-400">${parseFloat(i.price || 0).toFixed(2)} € / kos</span>
                        </div>
                        <div class="flex items-center space-x-3">
                            <div class="flex items-center border border-slate-300 rounded-lg overflow-hidden bg-white">
                                <button onclick="updateCartQty(${i.id}, -1)" class="px-2 py-1 text-slate-600 hover:bg-slate-100 font-bold text-xs">-</button>
                                <span class="px-2 py-1 text-xs font-bold text-slate-800">${i.qty}</span>
                                <button onclick="updateCartQty(${i.id}, 1)" class="px-2 py-1 text-slate-600 hover:bg-slate-100 font-bold text-xs">+</button>
                            </div>
                            <span class="font-bold text-xs text-teal-700 w-16 text-right">${sub.toFixed(2)} €</span>
                            <button onclick="removeFromCart(${i.id})" class="text-rose-400 hover:text-rose-600 px-1 text-xs"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            }).join('');
            document.getElementById('cart-total-price').innerText = total.toFixed(2) + " €";
        }

        function submitOrder(e) {
            e.preventDefault();
            if (cart.length === 0) {
                alert("Vaša košarica je prazna!");
                return;
            }

            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const notes = document.getElementById('cust-notes').value;

            let total = 0;
            let itemListText = cart.map(i => {
                const sub = (i.price || 0) * i.qty;
                total += sub;
                return `- ${i.name} (${i.qty}x) = ${sub.toFixed(2)} €`;
            }).join('\n');

            const message = `Pozdravljeni!\n\nOddajam novo naročilo na AkvarijskiSvet:\n\nSEZNAM IZDELKOV:\n${itemListText}\n\nSkupaj za plačilo: ${total.toFixed(2)} €\n\nPODATKI STRANKE:\nIme in priimek: ${name}\nTelefon: ${phone}\nOpombe: ${notes || '/'}`;

            const subject = encodeURIComponent(`Novo naročilo - AkvarijskiSvet (${name})`);
            const mailtoUrl = `mailto:${MOJ_EMAIL}?subject=${subject}&body=${encodeURIComponent(message)}`;

            window.location.href = mailtoUrl;

            alert("Naročilo je pripravljeno! Odprl se bo vaš e-poštni program, kjer potrdite pošiljanje.");
            cart = [];
            saveCart();
            toggleCartModal();
        }
    </script>
</body>
</html>
